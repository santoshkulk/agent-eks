AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Mortgage assistant workshop infrastructure: Amazon Bedrock Knowledge Base
  backed by OpenSearch Serverless, an EKS cluster, ECR, EKS Pod Identity,
  and encrypted DynamoDB storage for agent sessions and semantic memory.

Parameters:
  ProjectName:
    Type: String
    Default: mortgage-assistant
    MinLength: 3
    MaxLength: 20
    AllowedPattern: "^[a-z][a-z0-9-]*[a-z0-9]$"
    Description: Lowercase prefix used for resources with strict naming rules.
  AdminPrincipalArn:
    Type: String
    AllowedPattern: "^arn:[^:]+:iam::[0-9]{12}:(role|user)/.+$"
    Description: IAM role or user ARN granted EKS administrator and OpenSearch index access.
  ClusterPublicAccessCidr:
    Type: String
    AllowedPattern: "^(?:[0-9]{1,3}\\.){3}[0-9]{1,3}/(?:[0-9]|[12][0-9]|3[0-2])$"
    Description: CIDR allowed to reach the public EKS API endpoint, normally your-laptop-ip/32.
  KubernetesVersion:
    Type: String
    Default: "1.36"
    AllowedValues:
      - "1.34"
      - "1.35"
      - "1.36"
  NodeInstanceType:
    Type: String
    Default: m7i.large
    AllowedValues:
      - m7i.large
      - m7i.xlarge
      - m6i.large
      - m6i.xlarge
  NodeDesiredSize:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 4
  EmbeddingModelId:
    Type: String
    Default: amazon.titan-embed-text-v2:0
    AllowedValues:
      - amazon.titan-embed-text-v2:0
    Description: Embedding model whose default output matches the 1024-dimension vector index.
  AgentModelId:
    Type: String
    Default: us.anthropic.claude-sonnet-4-6
  KnowledgeBaseParameterName:
    Type: String
    Default: /app/mortgage_assistant/kb_id
  MemoryTableName:
    Type: String
    Default: mortgage-assistant-workshop-memory
    MinLength: 3
    MaxLength: 255
    AllowedPattern: "^[A-Za-z0-9_.-]+$"
  MemoryVectorIndexName:
    Type: String
    Default: vector_index
    MinLength: 3
    MaxLength: 255
    AllowedPattern: "^[A-Za-z0-9_.-]+$"
  MemoryEmbeddingModelId:
    Type: String
    Default: amazon.titan-embed-text-v2:0

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-vpc"

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref Vpc

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.42.0.0/20
      MapPublicIpOnLaunch: true
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-a"
        - Key: kubernetes.io/role/elb
          Value: "1"

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: 10.42.16.0/20
      MapPublicIpOnLaunch: true
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-b"
        - Key: kubernetes.io/role/elb
          Value: "1"

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.42.32.0/20
      MapPublicIpOnLaunch: false
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-a"
        - Key: kubernetes.io/role/internal-elb
          Value: "1"

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: 10.42.48.0/20
      MapPublicIpOnLaunch: false
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-b"
        - Key: kubernetes.io/role/internal-elb
          Value: "1"

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet1

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet2

  NatElasticIp:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatElasticIp.AllocationId
      SubnetId: !Ref PublicSubnet1

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnet1

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnet2

  KnowledgeBaseBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  KnowledgeBaseBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref KnowledgeBaseBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt KnowledgeBaseBucket.Arn
              - !Sub "${KnowledgeBaseBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  OpenSearchEncryptionPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: !Sub "${ProjectName}-enc"
      Type: encryption
      Policy: !Sub >-
        {
          "Rules": [
            {
              "ResourceType": "collection",
              "Resource": ["collection/${ProjectName}-vectors"]
            }
          ],
          "AWSOwnedKey": true
        }

  OpenSearchNetworkPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: !Sub "${ProjectName}-net"
      Type: network
      Policy: !Sub >-
        [
          {
            "Rules": [
              {
                "ResourceType": "collection",
                "Resource": ["collection/${ProjectName}-vectors"]
              },
              {
                "ResourceType": "dashboard",
                "Resource": ["collection/${ProjectName}-vectors"]
              }
            ],
            "AllowFromPublic": true
          }
        ]

  KnowledgeBaseRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*"
      Policies:
        - PolicyName: KnowledgeBaseAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: InvokeEmbeddingModel
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${EmbeddingModelId}"
              - Sid: ReadSourceDocuments
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt KnowledgeBaseBucket.Arn
                  - !Sub "${KnowledgeBaseBucket.Arn}/*"
                Condition:
                  StringEquals:
                    aws:ResourceAccount: !Ref AWS::AccountId
              - Sid: OpenSearchDataPlane
                Effect: Allow
                Action: aoss:APIAccessAll
                Resource: !GetAtt VectorCollection.Arn

  OpenSearchDataAccessPolicy:
    Type: AWS::OpenSearchServerless::AccessPolicy
    Properties:
      Name: !Sub "${ProjectName}-data"
      Type: data
      Policy: !Sub
        - >-
          [
            {
              "Description": "Knowledge base and deployment access",
              "Principal": ["${KbRoleArn}", "${AdminArn}"],
              "Rules": [
                {
                  "ResourceType": "collection",
                  "Resource": ["collection/${ProjectName}-vectors"],
                  "Permission": [
                    "aoss:CreateCollectionItems",
                    "aoss:DeleteCollectionItems",
                    "aoss:UpdateCollectionItems",
                    "aoss:DescribeCollectionItems"
                  ]
                },
                {
                  "ResourceType": "index",
                  "Resource": ["index/${ProjectName}-vectors/*"],
                  "Permission": [
                    "aoss:CreateIndex",
                    "aoss:DeleteIndex",
                    "aoss:UpdateIndex",
                    "aoss:DescribeIndex",
                    "aoss:ReadDocument",
                    "aoss:WriteDocument"
                  ]
                }
              ]
            }
          ]
        - KbRoleArn: !GetAtt KnowledgeBaseRole.Arn
          AdminArn: !Ref AdminPrincipalArn

  VectorCollection:
    Type: AWS::OpenSearchServerless::Collection
    DependsOn:
      - OpenSearchEncryptionPolicy
      - OpenSearchNetworkPolicy
    Properties:
      Name: !Sub "${ProjectName}-vectors"
      Description: Vector collection for the mortgage knowledge base
      StandbyReplicas: DISABLED
      Type: VECTORSEARCH

  VectorIndex:
    Type: AWS::OpenSearchServerless::Index
    DependsOn: OpenSearchDataAccessPolicy
    Properties:
      CollectionEndpoint: !GetAtt VectorCollection.CollectionEndpoint
      IndexName: mortgage-index
      Settings:
        Index:
          Knn: true
          KnnAlgoParamEfSearch: 512
      Mappings:
        Properties:
          vector:
            Type: knn_vector
            Dimension: 1024
            Method:
              Name: hnsw
              Engine: faiss
              SpaceType: l2
          text:
            Type: text
          text-metadata:
            Type: text
            Index: false

  MortgageKnowledgeBase:
    Type: AWS::Bedrock::KnowledgeBase
    DependsOn: VectorIndex
    Properties:
      Name: !Sub "${ProjectName}-kb"
      Description: Knowledge base containing mortgage workshop documents
      RoleArn: !GetAtt KnowledgeBaseRole.Arn
      KnowledgeBaseConfiguration:
        Type: VECTOR
        VectorKnowledgeBaseConfiguration:
          EmbeddingModelArn: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${EmbeddingModelId}"
      StorageConfiguration:
        Type: OPENSEARCH_SERVERLESS
        OpensearchServerlessConfiguration:
          CollectionArn: !GetAtt VectorCollection.Arn
          VectorIndexName: mortgage-index
          FieldMapping:
            VectorField: vector
            TextField: text
            MetadataField: text-metadata

  MortgageKnowledgeBaseDataSource:
    Type: AWS::Bedrock::DataSource
    Properties:
      Name: mortgage-documents
      KnowledgeBaseId: !Ref MortgageKnowledgeBase
      DataSourceConfiguration:
        Type: S3
        S3Configuration:
          BucketArn: !GetAtt KnowledgeBaseBucket.Arn
      VectorIngestionConfiguration:
        ChunkingConfiguration:
          ChunkingStrategy: FIXED_SIZE
          FixedSizeChunkingConfiguration:
            MaxTokens: 512
            OverlapPercentage: 20

  KnowledgeBaseIdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Ref KnowledgeBaseParameterName
      Type: String
      Value: !Ref MortgageKnowledgeBase
      Description: Knowledge base ID used by the mortgage assistant.

  EksSecretsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: EKS Kubernetes secrets envelope encryption key
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableAccountPermissions
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"

  EksClusterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonEKSClusterPolicy"

  EksControlPlaneLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/eks/${AWS::StackName}-cluster/cluster"
      RetentionInDays: 30

  EksCluster:
    Type: AWS::EKS::Cluster
    DependsOn:
      - EksControlPlaneLogGroup
      - PrivateDefaultRoute
    Properties:
      Name: !Sub "${AWS::StackName}-cluster"
      Version: !Ref KubernetesVersion
      RoleArn: !GetAtt EksClusterRole.Arn
      AccessConfig:
        AuthenticationMode: API
        BootstrapClusterCreatorAdminPermissions: false
      EncryptionConfig:
        - Provider:
            KeyArn: !GetAtt EksSecretsKey.Arn
          Resources:
            - secrets
      Logging:
        ClusterLogging:
          EnabledTypes:
            - Type: api
            - Type: audit
            - Type: authenticator
            - Type: controllerManager
            - Type: scheduler
      ResourcesVpcConfig:
        EndpointPrivateAccess: true
        EndpointPublicAccess: true
        PublicAccessCidrs:
          - !Ref ClusterPublicAccessCidr
        SubnetIds:
          - !Ref PrivateSubnet1
          - !Ref PrivateSubnet2

  EksAdminAccessEntry:
    Type: AWS::EKS::AccessEntry
    Properties:
      ClusterName: !Ref EksCluster
      PrincipalArn: !Ref AdminPrincipalArn
      Type: STANDARD
      AccessPolicies:
        - PolicyArn: !Sub "arn:${AWS::Partition}:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy"
          AccessScope:
            Type: cluster

  EksNodeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonEKSWorkerNodePolicy"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonEKS_CNI_Policy"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonEC2ContainerRegistryPullOnly"

  EksNodeLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              DeleteOnTermination: true
              Encrypted: true
              VolumeSize: 30
              VolumeType: gp3
        MetadataOptions:
          HttpEndpoint: enabled
          HttpPutResponseHopLimit: 1
          HttpTokens: required
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub "${AWS::StackName}-eks-node"

  EksNodeGroup:
    Type: AWS::EKS::Nodegroup
    DependsOn:
      - EksAdminAccessEntry
      - PrivateDefaultRoute
    Properties:
      ClusterName: !Ref EksCluster
      AmiType: BOTTLEROCKET_x86_64
      CapacityType: ON_DEMAND
      InstanceTypes:
        - !Ref NodeInstanceType
      Labels:
        workload: mortgage-assistant
      LaunchTemplate:
        Id: !Ref EksNodeLaunchTemplate
        Version: !GetAtt EksNodeLaunchTemplate.LatestVersionNumber
      NodeRole: !GetAtt EksNodeRole.Arn
      ScalingConfig:
        DesiredSize: !Ref NodeDesiredSize
        MaxSize: 4
        MinSize: 1
      Subnets:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      UpdateConfig:
        MaxUnavailable: 1

  VpcCniAddon:
    Type: AWS::EKS::Addon
    Properties:
      AddonName: vpc-cni
      ClusterName: !Ref EksCluster
      ResolveConflicts: OVERWRITE

  KubeProxyAddon:
    Type: AWS::EKS::Addon
    Properties:
      AddonName: kube-proxy
      ClusterName: !Ref EksCluster
      ResolveConflicts: OVERWRITE

  CoreDnsAddon:
    Type: AWS::EKS::Addon
    DependsOn: EksNodeGroup
    Properties:
      AddonName: coredns
      ClusterName: !Ref EksCluster
      ResolveConflicts: OVERWRITE

  PodIdentityAgentAddon:
    Type: AWS::EKS::Addon
    DependsOn: EksNodeGroup
    Properties:
      AddonName: eks-pod-identity-agent
      ClusterName: !Ref EksCluster
      ResolveConflicts: OVERWRITE

  MortgageAssistantRepository:
    Type: AWS::ECR::Repository
    Properties:
      EmptyOnDelete: true
      EncryptionConfiguration:
        EncryptionType: AES256
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: IMMUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the newest ten images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": {"type": "expire"}
              }
            ]
          }

  MemoryEncryptionKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "Encrypts ${MemoryTableName} for the mortgage assistant workshop"
      EnableKeyRotation: true
      PendingWindowInDays: 7
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableAccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"

  MemoryEncryptionKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${AWS::StackName}-agent-memory"
      TargetKeyId: !Ref MemoryEncryptionKey

  MortgageAssistantPodRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: pods.eks.amazonaws.com
            Action:
              - sts:AssumeRole
              - sts:TagSession
      Policies:
        - PolicyName: MortgageAssistantAwsAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadKnowledgeBaseParameter
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${KnowledgeBaseParameterName}"
              - Sid: RetrieveFromKnowledgeBase
                Effect: Allow
                Action: bedrock:Retrieve
                Resource: !GetAtt MortgageKnowledgeBase.KnowledgeBaseArn
              - Sid: InvokeAgentModels
                Effect: Allow
                Action:
                  - bedrock:GetInferenceProfile
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/*"
                  - !Sub "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*"
              - Sid: ReadWriteAgentMemory
                Effect: Allow
                Action:
                  - dynamodb:DeleteItem
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${MemoryTableName}"
              - Sid: SearchAgentMemory
                Effect: Allow
                Action: dynamodb:SearchVectors
                Resource:
                  - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${MemoryTableName}"
                  - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${MemoryTableName}/index/${MemoryVectorIndexName}"
              - Sid: UseMemoryEncryptionKey
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                  - kms:Encrypt
                  - kms:GenerateDataKey
                  - kms:ReEncryptFrom
                  - kms:ReEncryptTo
                Resource: !GetAtt MemoryEncryptionKey.Arn

  MortgageAssistantPodIdentity:
    Type: AWS::EKS::PodIdentityAssociation
    DependsOn: PodIdentityAgentAddon
    Properties:
      ClusterName: !Ref EksCluster
      Namespace: mortgage-assistant
      ServiceAccount: mortgage-assistant
      RoleArn: !GetAtt MortgageAssistantPodRole.Arn

  AwsLoadBalancerControllerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: pods.eks.amazonaws.com
            Action:
              - sts:AssumeRole
              - sts:TagSession
      Policies:
        - PolicyName: AwsLoadBalancerController
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: "*"
                Condition:
                  StringEquals:
                    iam:AWSServiceName: elasticloadbalancing.amazonaws.com
              - Effect: Allow
                Action:
                  - ec2:DescribeAccountAttributes
                  - ec2:DescribeAddresses
                  - ec2:DescribeAvailabilityZones
                  - ec2:DescribeCoipPools
                  - ec2:DescribeInstances
                  - ec2:DescribeInternetGateways
                  - ec2:DescribeIpamPools
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeRouteTables
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSubnets
                  - ec2:DescribeTags
                  - ec2:DescribeVpcs
                  - ec2:DescribeVpcPeeringConnections
                  - ec2:GetCoipPoolUsage
                  - ec2:GetSecurityGroupsForVpc
                  - elasticloadbalancing:DescribeCapacityReservation
                  - elasticloadbalancing:DescribeListenerCertificates
                  - elasticloadbalancing:DescribeListenerAttributes
                  - elasticloadbalancing:DescribeListeners
                  - elasticloadbalancing:DescribeLoadBalancerAttributes
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeRules
                  - elasticloadbalancing:DescribeSSLPolicies
                  - elasticloadbalancing:DescribeTargetGroupAttributes
                  - elasticloadbalancing:DescribeTargetGroups
                  - elasticloadbalancing:DescribeTargetHealth
                  - elasticloadbalancing:DescribeTags
                  - elasticloadbalancing:DescribeTrustStores
                Resource: "*"
              - Effect: Allow
                Action:
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:CreateSecurityGroup
                  - ec2:RevokeSecurityGroupIngress
                Resource: "*"
              - Effect: Allow
                Action: ec2:CreateTags
                Resource: !Sub "arn:${AWS::Partition}:ec2:*:*:security-group/*"
                Condition:
                  StringEquals:
                    ec2:CreateAction: CreateSecurityGroup
                  "Null":
                    aws:RequestTag/elbv2.k8s.aws/cluster: "false"
              - Effect: Allow
                Action:
                  - ec2:CreateTags
                  - ec2:DeleteTags
                Resource: !Sub "arn:${AWS::Partition}:ec2:*:*:security-group/*"
                Condition:
                  "Null":
                    aws:RequestTag/elbv2.k8s.aws/cluster: "true"
                    aws:ResourceTag/elbv2.k8s.aws/cluster: "false"
              - Effect: Allow
                Action:
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:DeleteSecurityGroup
                  - ec2:RevokeSecurityGroupIngress
                Resource: "*"
                Condition:
                  "Null":
                    aws:ResourceTag/elbv2.k8s.aws/cluster: "false"
              - Effect: Allow
                Action:
                  - elasticloadbalancing:CreateLoadBalancer
                  - elasticloadbalancing:CreateTargetGroup
                Resource: "*"
                Condition:
                  "Null":
                    aws:RequestTag/elbv2.k8s.aws/cluster: "false"
              - Effect: Allow
                Action:
                  - elasticloadbalancing:CreateListener
                  - elasticloadbalancing:DeleteListener
                Resource: "*"
              - Effect: Allow
                Action:
                  - elasticloadbalancing:AddTags
                  - elasticloadbalancing:RemoveTags
                Resource:
                  - !Sub "arn:${AWS::Partition}:elasticloadbalancing:*:*:targetgroup/*/*"
                  - !Sub "arn:${AWS::Partition}:elasticloadbalancing:*:*:loadbalancer/net/*/*"
                Condition:
                  "Null":
                    aws:RequestTag/elbv2.k8s.aws/cluster: "true"
                    aws:ResourceTag/elbv2.k8s.aws/cluster: "false"
              - Effect: Allow
                Action:
                  - elasticloadbalancing:AddTags
                  - elasticloadbalancing:RemoveTags
                Resource: !Sub "arn:${AWS::Partition}:elasticloadbalancing:*:*:listener/net/*/*/*"
              - Effect: Allow
                Action:
                  - elasticloadbalancing:DeleteLoadBalancer
                  - elasticloadbalancing:DeleteTargetGroup
                  - elasticloadbalancing:ModifyCapacityReservation
                  - elasticloadbalancing:ModifyListenerAttributes
                  - elasticloadbalancing:ModifyLoadBalancerAttributes
                  - elasticloadbalancing:ModifyIpPools
                  - elasticloadbalancing:ModifyTargetGroup
                  - elasticloadbalancing:ModifyTargetGroupAttributes
                  - elasticloadbalancing:SetIpAddressType
                  - elasticloadbalancing:SetSecurityGroups
                  - elasticloadbalancing:SetSubnets
                Resource: "*"
                Condition:
                  "Null":
                    aws:ResourceTag/elbv2.k8s.aws/cluster: "false"
              - Effect: Allow
                Action: elasticloadbalancing:AddTags
                Resource:
                  - !Sub "arn:${AWS::Partition}:elasticloadbalancing:*:*:targetgroup/*/*"
                  - !Sub "arn:${AWS::Partition}:elasticloadbalancing:*:*:loadbalancer/net/*/*"
                Condition:
                  StringEquals:
                    elasticloadbalancing:CreateAction:
                      - CreateTargetGroup
                      - CreateLoadBalancer
                  "Null":
                    aws:RequestTag/elbv2.k8s.aws/cluster: "false"
              - Effect: Allow
                Action:
                  - elasticloadbalancing:DeregisterTargets
                  - elasticloadbalancing:RegisterTargets
                Resource: !Sub "arn:${AWS::Partition}:elasticloadbalancing:*:*:targetgroup/*/*"

  AwsLoadBalancerControllerPodIdentity:
    Type: AWS::EKS::PodIdentityAssociation
    DependsOn: PodIdentityAgentAddon
    Properties:
      ClusterName: !Ref EksCluster
      Namespace: kube-system
      ServiceAccount: aws-load-balancer-controller
      RoleArn: !GetAtt AwsLoadBalancerControllerRole.Arn

Outputs:
  VpcId:
    Value: !Ref Vpc
  KnowledgeBaseBucketName:
    Value: !Ref KnowledgeBaseBucket
  KnowledgeBaseId:
    Value: !Ref MortgageKnowledgeBase
  KnowledgeBaseDataSourceId:
    Value: !GetAtt MortgageKnowledgeBaseDataSource.DataSourceId
  KnowledgeBaseParameterName:
    Value: !Ref KnowledgeBaseParameterName
  EksClusterName:
    Value: !Ref EksCluster
  EcrRepositoryUri:
    Value: !GetAtt MortgageAssistantRepository.RepositoryUri
  AgentModelId:
    Value: !Ref AgentModelId
  MemoryTableName:
    Value: !Ref MemoryTableName
  MemoryTableArn:
    Value: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${MemoryTableName}"
  MemoryKmsKeyArn:
    Value: !GetAtt MemoryEncryptionKey.Arn
  MemoryVectorIndexName:
    Value: !Ref MemoryVectorIndexName
  MemoryEmbeddingModelId:
    Value: !Ref MemoryEmbeddingModelId
  PodIdentityRoleArn:
    Value: !GetAtt MortgageAssistantPodRole.Arn
  AwsLoadBalancerControllerRoleArn:
    Value: !GetAtt AwsLoadBalancerControllerRole.Arn
